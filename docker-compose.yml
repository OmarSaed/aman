version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aman_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aman_erp}
      POSTGRES_USER: ${POSTGRES_USER:-aman_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aman_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aman_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aman_user} -d ${POSTGRES_DB:-aman_erp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aman_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aman_user}:${POSTGRES_PASSWORD:-aman_pass}@postgres:5432/${POSTGRES_DB:-aman_erp}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      NODE_ENV: production
      PORT: 5000
      LEGACY_MSSQL_HOST: ${LEGACY_MSSQL_HOST:-mssql-legacy}
      LEGACY_MSSQL_PORT: ${LEGACY_MSSQL_PORT:-1433}
      LEGACY_MSSQL_USER: ${LEGACY_MSSQL_USER:-sa}
      LEGACY_MSSQL_PASSWORD: ${MSSQL_SA_PASSWORD:-AmanLegacy_2026!}
      LEGACY_MSSQL_DATABASE: ${LEGACY_MSSQL_DATABASE:-LegacyPOS}
      LEGACY_MSSQL_ENCRYPT: "false"
      LEGACY_BAK_SQL_PATH: ${LEGACY_BAK_SQL_PATH:-/var/opt/mssql/backup/uploads/backup.bak}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backup.bak:/app/legacy/backup.bak:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aman_network
    expose:
      - "5000"

  mssql-legacy:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aman_mssql_legacy
    profiles: ["legacy"]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-AmanLegacy_2026!}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_legacy_data:/var/opt/mssql
      - ./backend/uploads/legacy:/var/opt/mssql/backup/uploads
      - ./backup.bak:/var/opt/mssql/backup/root.bak:ro
    networks:
      - aman_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: aman_frontend
    restart: unless-stopped
    networks:
      - aman_network
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: aman_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - aman_network

volumes:
  postgres_data:
    driver: local
  mssql_legacy_data:
    driver: local

networks:
  aman_network:
    driver: bridge
