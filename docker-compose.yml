services:
  postgres:
    image: postgres:16-alpine
    container_name: dongol_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aman_erp}
      POSTGRES_USER: ${POSTGRES_USER:-aman_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aman_pass}
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aman_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aman_user} -d ${POSTGRES_DB:-aman_erp}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dongol_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aman_user}:${POSTGRES_PASSWORD:-aman_pass}@postgres:5432/${POSTGRES_DB:-aman_erp}
      JWT_ACCESS_SECRET: 4f7c1d8e2b3a9c6f5d0e7b4a1c8f3e2d5c0b9a6f8e4d2a1c0b3d8f5e7a9c6f2d
      JWT_REFRESH_SECRET: a1b2c3d4e5f67890abcdef1234567890abcdef1234567890abcdef1234567890
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      NODE_ENV: production
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aman_network
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: dongol_frontend
    restart: unless-stopped
    networks:
      - aman_network
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: dongol_nginx
    restart: unless-stopped
    ports:
      - "9002:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - aman_network

volumes:
  postgres_data:
    driver: local

networks:
  aman_network:
    driver: bridge
