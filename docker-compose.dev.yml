services:
  postgres:
    image: postgres:16-alpine
    container_name: aman_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: aman_erp_dev
      POSTGRES_USER: aman_user
      POSTGRES_PASSWORD: aman_pass
    ports:
      - "5444:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - aman_dev_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aman_user -d aman_erp_dev" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: aman_backend_dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aman_user:aman_pass@postgres:5432/aman_erp_dev
      JWT_ACCESS_SECRET: dev_access_secret_change_in_production_32chars
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_production_32chars
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      NODE_ENV: development
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aman_dev_network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: aman_frontend_dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - aman_dev_network
    command: npm run dev -- --host

volumes:
  postgres_dev_data:
    driver: local

networks:
  aman_dev_network:
    driver: bridge
